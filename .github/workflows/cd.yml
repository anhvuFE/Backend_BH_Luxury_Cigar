name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --only=production

    - name: Run tests before deployment
      env:
        MONGODB_URI: mongodb://localhost:27017/test_db
        JWT_SECRET: test_jwt_secret_key
        NODE_ENV: test
      run: npm test || true
      continue-on-error: true

    # Deploy to Heroku
    - name: Deploy to Heroku
      if: ${{ secrets.HEROKU_API_KEY != '' }}
      uses: akhileshns/heroku-deploy@v3.12.14
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        buildpack: heroku/nodejs
      continue-on-error: true

    # Deploy to Railway
    - name: Deploy to Railway
      if: ${{ secrets.RAILWAY_TOKEN != '' }}
      run: |
        npm install -g @railway/cli
        railway link ${{ secrets.RAILWAY_PROJECT_ID }} || true
        railway up || true
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      continue-on-error: true

    # Deploy to Render
    - name: Deploy to Render
      if: ${{ secrets.RENDER_API_KEY != '' }}
      run: |
        curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'
      continue-on-error: true

    # Deploy to DigitalOcean App Platform
    - name: Deploy to DigitalOcean
      if: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN != '' }}
      uses: digitalocean/app_action@v1.1.5
      with:
        app_name: ${{ secrets.DO_APP_NAME }}
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      continue-on-error: true

    # Deploy using Docker
    - name: Build and Push Docker image
      if: ${{ secrets.DOCKER_USERNAME != '' }}
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker build -t ${{ secrets.DOCKER_USERNAME }}/bh-luxury-cigar:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/bh-luxury-cigar:latest
      continue-on-error: true

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Deployment to production ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Deploy to Vercel
      if: ${{ secrets.VERCEL_TOKEN != '' }}
      run: |
        npm install -g vercel
        vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      continue-on-error: true

    - name: Deploy to Netlify
      if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
      uses: nwtgck/actions-netlify@v2.0
      with:
        publish-dir: '.'
        production-deploy: false
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions"
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      continue-on-error: true