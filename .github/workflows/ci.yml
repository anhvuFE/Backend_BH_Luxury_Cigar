name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        mongodb-version: ['6.0', '7.0']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.10.0
      with:
        mongodb-version: ${{ matrix.mongodb-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint || true
      continue-on-error: true

    - name: Run tests
      env:
        MONGODB_URI: mongodb://localhost:27017/test_db
        JWT_SECRET: test_jwt_secret_key
        NODE_ENV: test
      run: npm test || true
      continue-on-error: true

    - name: Run security audit
      run: npm audit --audit-level=moderate || true
      continue-on-error: true

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for vulnerable dependencies
      run: |
        npm audit --json > audit.json || true
        echo "Audit report generated"

    - name: Check code formatting
      run: |
        npm install --save-dev prettier
        npx prettier --check "src/**/*.js" || true
      continue-on-error: true

    - name: Run ESLint
      run: |
        npm install --save-dev eslint
        npx eslint src/ --ext .js || true
      continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        echo "NODE_ENV=production" >> .env
        echo "PORT=3000" >> .env
        echo "MONGODB_URI=${{ secrets.MONGODB_URI || 'mongodb://localhost:27017/bh_luxury_cigar' }}" >> .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET || 'your_jwt_secret_key_here' }}" >> .env

    - name: Test server startup
      run: |
        timeout 10s npm start || code=$?
        if [ $code -eq 124 ]; then
          echo "Server started successfully (timeout expected)"
          exit 0
        else
          echo "Server failed to start"
          exit 1
        fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t bh-luxury-cigar-backend:${{ github.sha }} .
      continue-on-error: true

    - name: Test Docker image
      if: success()
      run: |
        docker run -d -p 3000:3000 --name test-container \
          -e MONGODB_URI=mongodb://host.docker.internal:27017/test \
          -e JWT_SECRET=test_secret \
          bh-luxury-cigar-backend:${{ github.sha }}
        sleep 5
        curl -f http://localhost:3000/health || exit 1
        docker stop test-container
      continue-on-error: true